name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.14'

      - name: Install tooling and test dependencies
        run: |
          python -m pip install --upgrade pip
          pip install ruff mypy xxhash send2trash

      - name: Ruff (lint)
        run: ruff check src tests

      - name: Mypy (type check)
        run: mypy src main.py tests

      - name: Unit tests
        run: python -m unittest discover -s tests -t .
